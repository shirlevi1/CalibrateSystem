<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8" />
</head>
<body dir="rtl" style="direction: rtl; text-align: right; margin: 0; padding: 0; background-color: #f6f8fa; font-family: Arial, sans-serif; color: #1f2937;">
    <div dir="rtl" style="direction: rtl; text-align: right; max-width: 680px; margin: 0 auto; padding: 16px;">
        <div dir="rtl" style="direction: rtl; text-align: right; background-color: #ffffff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px;">
            <div dir="rtl" style="direction: rtl; text-align: right; font-size: 15px; font-weight: 700; color: #2f4f68; margin-bottom: 8px;">פרטי המשתמש</div>
            <div dir="rtl" style="direction: rtl; text-align: right; font-size: 14px; line-height: 1.6; color: #111827;">
                <div><strong>שם משתמש:</strong> <bdi dir="auto">{{ user_name }}</bdi></div>
                <div><strong>אימייל משתמש:</strong> <bdi dir="ltr">{{ user_email }}</bdi></div>
                <div><strong>תפקיד:</strong> <bdi dir="auto">{{ user_role }}</bdi></div>
                <div><strong>מזהה פרויקט:</strong> <bdi dir="ltr">{{ project_id }}</bdi></div>
            </div>
        </div>
        <div dir="auto" style="text-align: start;">
            {{ message_html|safe }}
        </div>
    </div>
</body>
</html>
